workflows:
  ios-cloud-validation:
    name: FYRUP iOS Cloud Build & Tests
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - fyrup_backend
      xcode: latest
    cache:
      cache_paths:
        - $HOME/Library/Caches/org.swift.swiftpm
        - $HOME/Library/Developer/Xcode/DerivedData
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Validate exercise catalog and workout privacy rules
        script: |
          node scripts/validate-exercise-catalog.mjs
          npm install --prefix .qa/workout-db --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.5.8 @electric-sql/pglite-pgtap@0.0.9
          node supabase/tests/run_personal_training_tests.mjs
          node supabase/tests/run_deployment_bundle_tests.mjs
          node supabase/tests/run_onboarding_tests.mjs
          node --test supabase/functions/dispatch-notifications/dispatch-queue.test.mjs
      - name: Inject Supabase configuration
        script: |
          plutil -replace SUPABASE_URL -string "$SUPABASE_URL" FYRUP/Resources/BackendConfig.plist
          plutil -replace SUPABASE_PUBLISHABLE_KEY -string "$SUPABASE_PUBLISHABLE_KEY" FYRUP/Resources/BackendConfig.plist
          plutil -replace APP_ENVIRONMENT -string "production" FYRUP/Resources/BackendConfig.plist
      - name: Generate Xcode project
        script: xcodegen generate
      - name: Validate project settings
        script: xcodebuild -project FYRUP.xcodeproj -scheme FYRUP -showBuildSettings > /tmp/fyrup-build-settings.txt
      - name: Build and run tests
        script: |
          set -o pipefail
          xcodebuild clean test \
            -project FYRUP.xcodeproj \
            -scheme FYRUP \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -resultBundlePath build/FYRUP.xcresult \
            CODE_SIGNING_ALLOWED=NO
      - name: Create visual QA contact sheet
        script: swift scripts/make_contact_sheet.swift /tmp/fyrup-screenshots /tmp/fyrup-contact-sheet.png
    artifacts:
      - /tmp/fyrup-contact-sheet.png
      - /tmp/fyrup-screenshots/*.png
      - build/FYRUP.xcresult
      - /Users/builder/Library/Developer/Xcode/DerivedData/**/Build/Products/Debug-iphonesimulator/FYRUP.app

  ios-testflight:
    name: FYRUP Signed TestFlight Build
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      app_store_connect: Codemagic FYRUP
    environment:
      groups:
        - fyrup_backend
      ios_signing:
        provisioning_profiles:
          - profile: fyrup_app_store_healthkit
            environment_variable: FYRUP_SIGNING_PROFILE
        certificates:
          - FYRUP Apple Distribution
      vars:
        BUNDLE_ID: app.fyrup.ios
        XCODE_PROJECT: FYRUP.xcodeproj
        XCODE_SCHEME: FYRUP
      xcode: latest
    cache:
      cache_paths:
        - $HOME/Library/Caches/org.swift.swiftpm
        - $HOME/Library/Developer/Xcode/DerivedData
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Validate exercise catalog and workout privacy rules
        script: |
          node scripts/validate-exercise-catalog.mjs
          npm install --prefix .qa/workout-db --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.5.8 @electric-sql/pglite-pgtap@0.0.9
          node supabase/tests/run_personal_training_tests.mjs
          node supabase/tests/run_deployment_bundle_tests.mjs
          node supabase/tests/run_onboarding_tests.mjs
          node --test supabase/functions/dispatch-notifications/dispatch-queue.test.mjs
      - name: Inject Supabase configuration
        script: |
          plutil -replace SUPABASE_URL -string "$SUPABASE_URL" FYRUP/Resources/BackendConfig.plist
          plutil -replace SUPABASE_PUBLISHABLE_KEY -string "$SUPABASE_PUBLISHABLE_KEY" FYRUP/Resources/BackendConfig.plist
          plutil -replace APP_ENVIRONMENT -string "production" FYRUP/Resources/BackendConfig.plist
      - name: Generate Xcode project
        script: xcodegen generate
      - name: Verify renewed HealthKit signing profile
        script: |
          security cms -D -i "$FYRUP_SIGNING_PROFILE" | python3 -c 'import plistlib,sys; p=plistlib.load(sys.stdin.buffer); e=p.get("Entitlements",{}); assert e.get("application-identifier")=="6379AH75GK.app.fyrup.ios", "Unexpected signing target"; assert e.get("com.apple.developer.healthkit") is True, "HealthKit missing from profile"; assert e.get("aps-environment")=="production", "Production push missing"; assert "Default" in e.get("com.apple.developer.applesignin",[]), "Apple sign-in missing"; print("Verified FYRUP profile: HealthKit, Apple sign-in and production push")'
      - name: Run unit and UI tests
        script: |
          set -o pipefail
          xcodebuild test \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -resultBundlePath build/FYRUP-Release.xcresult \
            CODE_SIGNING_ALLOWED=NO
      - name: Apply provisioning profiles
        script: xcode-project use-profiles
      - name: Set unique build number
        script: agvtool new-version -all "$BUILD_NUMBER"
      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
      - name: Verify release backend configuration
        script: |
          IPA_PATH=$(find build/ios/ipa -name '*.ipa' -print -quit)
          test -n "$IPA_PATH"
          unzip -p "$IPA_PATH" 'Payload/*.app/BackendConfig.plist' > /tmp/FYRUP-BackendConfig.plist
          EMBEDDED_URL=$(plutil -extract SUPABASE_URL raw -o - /tmp/FYRUP-BackendConfig.plist)
          EMBEDDED_KEY=$(plutil -extract SUPABASE_PUBLISHABLE_KEY raw -o - /tmp/FYRUP-BackendConfig.plist)
          test "$EMBEDDED_URL" = "$SUPABASE_URL"
          test "$EMBEDDED_KEY" = "$SUPABASE_PUBLISHABLE_KEY"
    artifacts:
      - build/ios/ipa/*.ipa
      - build/FYRUP-Release.xcresult
      - /tmp/fyrup-screenshots/*.png
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
