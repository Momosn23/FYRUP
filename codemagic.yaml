workflows:
  ios-cloud-validation: &ios_qa
    name: FYRUP iOS QA (manual milestone)
    triggering:
      events: []
      cancel_previous_builds: true
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment: &ios_qa_environment
      groups:
        - fyrup_backend
      xcode: "26.6"
      vars:
        FYRUP_QA_FULL_REGRESSION: "false"
    # No external SPM packages. Do not cache the entire DerivedData tree.
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Validate exercise catalog and workout privacy rules
        script: |
          node scripts/validate-exercise-catalog.mjs
          npm install --prefix .qa/workout-db --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.5.8 @electric-sql/pglite-pgtap@0.0.9
          node scripts/audit-terminology.mjs
          node supabase/tests/run_workout_tests.mjs
          node supabase/tests/run_blind_tests.mjs
          node supabase/tests/run_copy_tests.mjs
          node supabase/tests/run_personal_training_tests.mjs
          node supabase/tests/run_preference_tests.mjs
          node supabase/tests/run_shot_tests.mjs
          node supabase/tests/run_step_tests.mjs
          node supabase/tests/run_weekly_tests.mjs
          node supabase/tests/run_supplement_tests.mjs
          node supabase/tests/run_deployment_bundle_tests.mjs
          node supabase/tests/run_onboarding_tests.mjs
          node supabase/tests/run_reference_revision_tests.mjs
          node --test supabase/functions/dispatch-notifications/dispatch-queue.test.mjs supabase/functions/dispatch-notifications/terminology.test.mjs
      - name: Inject Supabase configuration
        script: |
          : "${SUPABASE_URL:?Missing SUPABASE_URL in fyrup_backend}"
          : "${SUPABASE_PUBLISHABLE_KEY:?Missing SUPABASE_PUBLISHABLE_KEY in fyrup_backend}"
          plutil -replace SUPABASE_URL -string "$SUPABASE_URL" FYRUP/Resources/BackendConfig.plist
          plutil -replace SUPABASE_PUBLISHABLE_KEY -string "$SUPABASE_PUBLISHABLE_KEY" FYRUP/Resources/BackendConfig.plist
          plutil -replace APP_ENVIRONMENT -string "production" FYRUP/Resources/BackendConfig.plist
      - name: Generate Xcode project
        script: xcodegen generate
      - name: Validate project settings
        script: xcodebuild -project FYRUP.xcodeproj -scheme FYRUP -showBuildSettings > /tmp/fyrup-build-settings.txt
      - name: Build and run tests
        script: |
          python3 scripts/run-ios-reference-qa.py
      - name: Create visual QA contact sheet
        script: swift scripts/make_contact_sheet.swift /tmp/fyrup-screenshots /tmp/fyrup-contact-sheet.png
    artifacts:
      - /tmp/fyrup-contact-sheet.png
      - /tmp/fyrup-screenshots/*.png
      - /tmp/fyrup-screenshots/*.json
      - /tmp/fyrup-screenshots/*-accessibility.txt
      - build/FYRUP.xcresult
      - build/reference-qa/**
      - /Users/builder/Library/Developer/Xcode/DerivedData/**/Build/Products/Debug-iphonesimulator/FYRUP.app

  ios-full-regression:
    <<: *ios_qa
    name: FYRUP iOS full regression (manual, 60 minute cap)
    max_build_duration: 60
    environment:
      <<: *ios_qa_environment
      vars:
        FYRUP_QA_FULL_REGRESSION: "true"

  ios-testflight:
    name: FYRUP Signed TestFlight Build
    instance_type: mac_mini_m2
    max_build_duration: 120
    inputs:
      runTests:
        description: Run the full Release test suite before packaging
        type: boolean
        default: false
    integrations:
      app_store_connect: Codemagic FYRUP
    environment:
      groups:
        - fyrup_backend
      ios_signing:
        provisioning_profiles:
          - profile: fyrup_app_store_weatherkit
            environment_variable: FYRUP_SIGNING_PROFILE
          - profile: fyrup_live_app_store_appgroup
            environment_variable: FYRUP_LIVE_SIGNING_PROFILE
        certificates:
          - FYRUP Apple Distribution
      vars:
        BUNDLE_ID: app.fyrup.ios
        XCODE_PROJECT: FYRUP.xcodeproj
        XCODE_SCHEME: FYRUP
      xcode: "26.6"
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Validate exercise catalog and workout privacy rules
        script: |
          node scripts/validate-exercise-catalog.mjs
          npm install --prefix .qa/workout-db --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.5.8 @electric-sql/pglite-pgtap@0.0.9
          node scripts/audit-terminology.mjs
          node supabase/tests/run_workout_tests.mjs
          node supabase/tests/run_blind_tests.mjs
          node supabase/tests/run_copy_tests.mjs
          node supabase/tests/run_personal_training_tests.mjs
          node supabase/tests/run_preference_tests.mjs
          node supabase/tests/run_shot_tests.mjs
          node supabase/tests/run_step_tests.mjs
          node supabase/tests/run_weekly_tests.mjs
          node supabase/tests/run_supplement_tests.mjs
          node supabase/tests/run_deployment_bundle_tests.mjs
          node supabase/tests/run_onboarding_tests.mjs
          node supabase/tests/run_reference_revision_tests.mjs
          node --test supabase/functions/dispatch-notifications/dispatch-queue.test.mjs supabase/functions/dispatch-notifications/terminology.test.mjs
      - name: Inject Supabase configuration
        script: |
          : "${SUPABASE_URL:?Missing SUPABASE_URL in fyrup_backend}"
          : "${SUPABASE_PUBLISHABLE_KEY:?Missing SUPABASE_PUBLISHABLE_KEY in fyrup_backend}"
          plutil -replace SUPABASE_URL -string "$SUPABASE_URL" FYRUP/Resources/BackendConfig.plist
          plutil -replace SUPABASE_PUBLISHABLE_KEY -string "$SUPABASE_PUBLISHABLE_KEY" FYRUP/Resources/BackendConfig.plist
          plutil -replace APP_ENVIRONMENT -string "production" FYRUP/Resources/BackendConfig.plist
      - name: Generate Xcode project
        script: xcodegen generate
      - name: Verify renewed WeatherKit and App Group signing profiles
        script: |
          set -o pipefail
          python3 scripts/test_signing_profile.py
          security cms -D -i "$FYRUP_SIGNING_PROFILE" | python3 scripts/verify-signing-profile.py main
          security cms -D -i "$FYRUP_LIVE_SIGNING_PROFILE" | python3 scripts/verify-signing-profile.py live
      - name: Run unit and UI tests
        script: |
          set -o pipefail
          xcodebuild test \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -resultBundlePath build/FYRUP-Release.xcresult \
            ENABLE_TESTABILITY=YES \
            CODE_SIGNING_ALLOWED=NO
        when:
          condition: ${{ inputs.runTests }}
      - name: Apply provisioning profiles
        script: xcode-project use-profiles
      - name: Set unique build number
        script: agvtool new-version -all "$BUILD_NUMBER"
      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
      - name: Verify release backend configuration
        script: |
          set -euo pipefail
          python3 scripts/test_release_ipa.py
          IPA_PATH=$(find build/ios/ipa -name '*.ipa' -print -quit)
          test -n "$IPA_PATH"
          python3 scripts/verify-release-ipa.py "$IPA_PATH"
    artifacts:
      - build/ios/ipa/*.ipa
      - build/FYRUP-Release.xcresult
      - /tmp/fyrup-screenshots/*.png
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
