name: iOS
on:
  workflow_dispatch:
  pull_request:
# Main is validated by Codemagic. Keep GitHub's paid macOS runner manual while
# that account has no Actions budget, so a normal push cannot create a known
# billing failure and another failure notification.
concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: xcodebuild -project FYRUP.xcodeproj -scheme FYRUP -destination 'platform=iOS Simulator,name=iPhone 16 Pro' CODE_SIGNING_ALLOWED=NO build test
      - name: Keep simulator screenshots for visual diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fyrup-simulator-screenshots
          path: /tmp/fyrup-screenshots/*.png
          if-no-files-found: warn
          retention-days: 7
