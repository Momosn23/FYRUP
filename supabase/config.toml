project_id = "fyrup"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "fyrup://auth-callback"
additional_redirect_urls = ["fyrup://auth-callback"]
jwt_expiry = 3600
enable_signup = true
minimum_password_length = 6

[auth.external.apple]
enabled = false
client_id = ""
secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"

[functions.dispatch-notifications]
verify_jwt = false

[functions.delete-account]
verify_jwt = false
