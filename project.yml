name: FYRUP
options:
  developmentLanguage: de
  bundleIdPrefix: app.fyrup
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.6"
  generateEmptyDirectories: true
configs:
  Debug: debug
  Release: release
packages: {}
settings:
  base:
    SWIFT_VERSION: 6.0
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    VERSIONING_SYSTEM: apple-generic
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  FYRUP:
    type: application
    platform: iOS
    sources:
      - path: FYRUP
        excludes:
          - Resources/exercise-library.tsv
      - path: FYRUP/Resources/exercise-library.tsv
        buildPhase: resources
      - path: Shared
    dependencies:
      - target: FYRUPLive
        embed: true
    info:
      path: Config/FYRUP-Info.plist
      properties:
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: app.fyrup.session
            CFBundleURLSchemes: [fyrup]
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.fyrup.ios
        PRODUCT_NAME: FYRUP
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: FYRUP
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
        INFOPLIST_KEY_NSFaceIDUsageDescription: FYRUP kann Face ID zum Schutz deiner Sitzung verwenden.
        INFOPLIST_KEY_NSHealthShareUsageDescription: FYRUP liest auf deinen Wunsch deine heutigen Schritte und – nach eigener Freigabe – aktive Energie für deine Kalorienanzeige. Die zusammengefasste Schrittzahl teilst du nur nach gesonderter Zustimmung mit Freunden. Energie und Körperdaten bleiben privat.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: FYRUP schreibt keine Daten in Apple Health. Für deine Anzeigen werden ausschließlich die von dir freigegebenen Schritte und aktiven Energiedaten gelesen.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: FYRUP verwendet deinen ungefähren Standort auf Wunsch für das Wetter am gewählten Ort oder für eine von dir aktivierte Ankunftserinnerung. Die Wetter- und Ortssuche wird von Apple verarbeitet. Dein aktueller Standort wird nicht an Freunde oder FYRUP-Server gesendet.
        INFOPLIST_KEY_NSContactsUsageDescription: FYRUP zeigt dir auf Wunsch den iPhone-Kontaktdialog, damit du genau eine Person für eine Einladung auswählen kannst. Dein Adressbuch wird nicht hochgeladen.
        INFOPLIST_KEY_SUPABASE_URL: $(SUPABASE_URL)
        INFOPLIST_KEY_SUPABASE_PUBLISHABLE_KEY: $(SUPABASE_PUBLISHABLE_KEY)
        INFOPLIST_KEY_APP_ENVIRONMENT: $(APP_ENVIRONMENT)
        CODE_SIGN_ENTITLEMENTS: FYRUP/FYRUP.entitlements
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        TARGETED_DEVICE_FAMILY: 1
    entitlements:
      path: FYRUP/FYRUP.entitlements
      properties:
        aps-environment: development
        com.apple.developer.healthkit: true
        com.apple.developer.weatherkit: true
        com.apple.developer.applesignin:
          - Default
        com.apple.security.application-groups:
          - group.app.fyrup.shared
    scheme:
      testTargets:
        - FYRUPTests
        - FYRUPUITests
      gatherCoverageData: true
  FYRUPLive:
    type: app-extension
    platform: iOS
    sources:
      - path: FYRUPLive
      - path: Shared
    info:
      path: Config/FYRUPLive-Info.plist
      properties:
        CFBundleDisplayName: FYRUP LIVE
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.fyrup.ios.live
        GENERATE_INFOPLIST_FILE: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: 1
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        CODE_SIGN_ENTITLEMENTS: FYRUPLive/FYRUPLive.entitlements
    entitlements:
      path: FYRUPLive/FYRUPLive.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.fyrup.shared
  FYRUPTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FYRUPTests
        excludes:
          - Fixtures/**
      - path: FYRUPTests/Fixtures
        buildPhase: resources
    dependencies:
      - target: FYRUP
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  FYRUPUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [FYRUPUITests]
    dependencies:
      - target: FYRUP
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
